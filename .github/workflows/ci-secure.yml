name: CI-Secure
on: [push, pull_request]

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write
  issues: write

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  sast-scan:
    name: "SAST - Semgrep"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/flask
            p/security-audit

  secret-scan:
    name: "Secret Scan - Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: "Dependency Scan - pip-audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

  iac-scan:
    name: "IaC Scan - Checkov"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false
          skip_check: CKV_AWS_144

  build-scan-sign-push:
    name: "Build + Trivy + SBOM + Sign + Push"
    needs: [sast-scan, secret-scan, dependency-scan, iac-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name lowercase
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Scan image with Trivy (JSON for policy gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: json
          output: trivy-report.json
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Push to GHCR
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Sign image with Cosign (keyless)
        run: cosign sign --yes ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  dast-scan:
    name: "DAST - OWASP ZAP"
    needs: [sast-scan, secret-scan, dependency-scan, iac-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Start app
        run: |
          cd app
          nohup python -c "from app import app; app.run(host='0.0.0.0', port=5000)" > /tmp/app.log 2>&1 &
          echo "Waiting for app..."
          sleep 5
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/health > /dev/null 2>&1; then
              echo "App is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 2
          done
          curl -v http://localhost:5000/health || (cat /tmp/app.log && exit 1)

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000"
          allow_issue_writing: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

  policy-gate:
    name: "Policy Gate - OPA Conftest"
    needs: [build-scan-sign-push, dast-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.46.0/conftest_0.46.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.46.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Run policy checks on Trivy report
        run: conftest test trivy-report.json -p policies/rego/ --no-color

      - name: Gate decision
        run: |
          echo "All policy gates passed."
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Ready for production deployment."

  auto-issue:
    name: "Auto-create Issue on Failure"
    needs: [sast-scan, secret-scan, dependency-scan, iac-scan, build-scan-sign-push, dast-scan, policy-gate]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Security Pipeline Failed',
              '',
              `**Commit:** \`${context.sha.substring(0, 7)}\``,
              `**Branch:** \`${context.ref}\``,
              `**Triggered by:** ${context.actor}`,
              `**Workflow run:** [View details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### What to do',
              '1. Click the workflow run link above',
              '2. Check which job failed (red X)',
              '3. Read the scan report in that job',
              '4. Fix the findings and push again',
              '',
              '### Common fixes',
              '- **Semgrep**: Use parameterized queries, escape output, avoid shell=True',
              '- **Gitleaks**: Remove secrets, use environment variables instead',
              '- **pip-audit**: Upgrade vulnerable packages',
              '- **Checkov**: Fix Terraform misconfigurations (encryption, access control)',
              '- **Trivy**: Update base image or patch vulnerable packages',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security pipeline failed for ${context.sha.substring(0, 7)}`,
              body: body,
              labels: ['security', 'pipeline-failure']
            });
